[project]
name = "backend-rfid"
version = "0.1.0"
description = "Backend RFID - Inventario de computadoras y control de acceso"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
